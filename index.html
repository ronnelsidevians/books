<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Книги Марка і Давида"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="style.css"><title>Книги Марка і Давида</title></head><body data-theme="dark"><div class="app"><header class="hero"><div><div class="eyebrow">PDF Library · PWA v8</div><h1 id="appTitle">Книги Марка і Давида</h1><p class="lead">Мобільний порядок: 1 права → 2 права → 2 ліва → 3 права → 3 ліва. Нижня панель має кнопки назад/вперед і номер всередині повзунка.</p></div><div class="stats"><div><b id="totalBooks">0</b><span>книжок</span></div><div><b id="readBooks">0</b><span>прочитано</span></div><div><b id="readingBooks">0</b><span>читаю</span></div></div></header><section id="installPanel" class="installPanel hidden"><div><b>Встановити як застосунок</b><p id="installText">Можна додати на головний екран.</p></div><button id="installBtn" class="primary">Встановити</button><button id="closeInstall">×</button></section><section class="toolbar"><input id="search" type="search" placeholder="Пошук книги або серії…"><select id="filter"><option value="all">Усі</option><option value="read">Прочитані</option><option value="reading">Читаю</option><option value="unread">Не прочитані</option><option value="hidden">Приховані</option></select><select id="themeSelect"><option value="dark">Темна</option><option value="light">Світла</option><option value="warm">Тепла</option><option value="mint">Глибока мʼятна</option><option value="sage">Шавлієва</option><option value="blue">Блакитна</option><option value="newspaper">Газетна</option></select><button id="exportProgress">Зберегти прогрес</button><label>Відновити прогрес<input id="importProgress" type="file" accept="application/json" hidden></label></section><main id="library" class="library"></main></div><section id="reader" class="reader"><div class="readerTop"><button id="closeReader" aria-label="Назад">←</button><div class="readerTitle"><b id="readerBookTitle">Книжка</b><span id="pageInfo">Сторінка —</span></div><button id="markRead" class="primary">Прочитано</button></div><div class="readerStage"><button class="tapZone left" id="tapPrev"></button><div id="pageWrap" class="pageWrap"></div><button class="tapZone right" id="tapNext"></button></div><div class="readerBottom"><button id="prevPage" aria-label="Назад">←</button><div class="rangeWrap"><input id="pageSlider" type="range" min="1" max="1" value="1"><span id="sliderLabel" class="sliderLabel">1/1</span></div><button id="nextPage" aria-label="Вперед">→</button></div></section><script type="module" src="app.js"></script></body></html>
