<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PDF Library">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>PDF Library</title>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <span class="pill">Books PWA</span>
        <h1 id="appTitle">PDF Library</h1>
        <p id="stats" class="stats">Завантаження…</p>
      </div>
      <div class="controls">
        <input id="searchInput" type="search" placeholder="Пошук книг і папок…" autocomplete="off">
        <select id="themeSelect" aria-label="Тема">
          <option value="light">Світла</option>
          <option value="warm">Тепла</option>
          <option value="blue">Блакитна</option>
          <option value="dark">Темна</option>
        </select>
      </div>
    </section>

    <div id="error" class="error" hidden></div>
    <nav id="breadcrumb" class="breadcrumb" aria-label="Шлях"></nav>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <section id="reader" class="reader" hidden>
    <header class="readerBar">
      <strong id="readerTitle">PDF</strong>
      <div class="readerActions">
        <a id="downloadLink" class="button" href="#" download>Завантажити</a>
        <button id="closeReader" type="button">Закрити</button>
      </div>
    </header>
    <iframe id="readerFrame" title="PDF reader"></iframe>
  </section>

  <script src="app.js"></script>
</body>
</html>
