name: Build and deploy PDF library
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  SITE_TITLE: "Моя PDF-бібліотека"
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate catalog and covers
        run: |
          python build_library.py --title "$SITE_TITLE"
          find books -type f -iname "*.pdf" | sort || true
          cat data/books.json
      - name: Prepare artifact
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R index.html style.css app.js manifest.webmanifest sw.js .nojekyll icons data covers books dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
